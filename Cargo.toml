[package]
name = "portcullis"
version = "0.1.0"
edition = "2024"
description = "Host-level container egress controller prototype for Docker and nftables."
license = "MIT"
repository = "https://github.com/nikarh/portcullis"
readme = "PLAN.md"
keywords = ["docker", "nftables", "egress", "firewall"]
categories = ["network-programming", "virtualization"]

[dependencies]
ipnet = "2.11"
pico-args = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

[build-dependencies]
bindgen = "0.72.1"
