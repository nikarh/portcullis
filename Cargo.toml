[package]
name = "portcullis"
version = "0.3.0"
edition = "2024"
description = "Limits what Docker containers can connect to, from labels on containers and networks, with nftables."
license = "MIT OR Apache-2.0"
# Not on crates.io: the portcullis crate there is another project.
publish = false
repository = "https://github.com/nikarh/portcullis"
readme = "README.md"
keywords = ["docker", "nftables", "egress", "firewall"]
categories = ["network-programming", "virtualization"]

[dependencies]
crossbeam-channel = "0.5.15"
ctrlc = { version = "3.5.2", features = ["termination"] }
hickory-proto = "0.26.3"
indexmap = { version = "2.12.0", features = ["serde"] }
ipnet = "2.11"
netlink-sys = "0.9.0"
nix = { version = "0.31.3", features = ["socket"] }
pico-args = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.49.0", features = ["rt", "net", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

[build-dependencies]
bindgen = "0.73.2"
