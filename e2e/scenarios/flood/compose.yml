# Containers that misbehave: cut off (quarantined), or held to their limits.
services:
  # Sends one packet with someone else's address.
  spoofer:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.egress.web=ip:198.51.100.3,tcp:80
  # Scans more ports than --quarantine-denials allows per minute.
  scanner:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
  # At most 5 open connections.
  limited:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.egress.udp=ip:198.51.100.3,udp:9000
      - portcullis.limit.connections=5
  # At most 5 new connections per second.
  rated:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.limit.new-connections=5

networks:
  net:
    labels:
      - portcullis.enable=true
