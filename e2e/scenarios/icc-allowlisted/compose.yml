services:
  tester:
    build:
      context: ../../images/tester
    networks:
      appnet:
        aliases: [tester]
    labels:
      - "portcullis.enable=true"
      - "portcullis.icc.mode=allow-listed"
      - "portcullis.icc.allow.0=container:api-alias,tcp:8080"
      - "portcullis.icc.allow.1=container:udp-allowed,udp:9000"

  api:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=ok"]
    networks:
      appnet:
        aliases: [api-alias]

  blocked-api:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:9090", "-text=blocked"]
    networks: [appnet]

  udp-allowed:
    build:
      context: ../../images/udp-echo
    networks: [appnet]

  udp-blocked:
    build:
      context: ../../images/udp-echo
    networks:
      appnet:
        aliases: [udp-blocked]

networks:
  appnet:
    ipam:
      config:
        - subnet: 172.28.0.0/24
