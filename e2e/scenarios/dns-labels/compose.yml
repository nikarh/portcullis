# The VM's host resolver is QEMU's (10.0.2.3); the outside resolver is 198.51.100.2.
services:
  only-ip:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    dns: [198.51.100.2]
    labels:
      - portcullis.dns.0=ip:198.51.100.2
  only-host:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.dns.0=host
  host-and-ip:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.dns.0=host
      - portcullis.dns.1=ip:198.51.100.2
  any:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.dns.0=*
  none:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    labels:
      - portcullis.dns.0=none
  none-with-dns:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    dns: [198.51.100.2]
    labels:
      - portcullis.dns.0=none

networks:
  net:
    labels:
      - portcullis.enable=true
