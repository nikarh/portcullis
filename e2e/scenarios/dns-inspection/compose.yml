# dyn.test resolves only through the outside DNS server, not on the Docker host, so its
# address is only allowed once Portcullis has seen the container's lookup.
services:
  app:
    image: portcullis-e2e-tester
    pull_policy: never
    networks: [net]
    dns: [198.51.100.2]
    labels:
      - portcullis.egress.dyn=host:dyn.test,tcp:80

networks:
  net:
    labels:
      - portcullis.enable=true
