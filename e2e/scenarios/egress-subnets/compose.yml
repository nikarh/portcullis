services:
  tester:
    build:
      context: ../../images/tester
    networks:
      neta:
        ipv4_address: 172.30.0.2
    labels:
      - "portcullis.enable=true"
      - "portcullis.icc.mode=allow"
      - "portcullis.egress.0=ip:172.31.0.10/32,tcp:8080"
      - "portcullis.egress.1=ip:172.31.0.20/32,udp:9000"

  allowed-web:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=allowed"]
    networks:
      netb:
        ipv4_address: 172.31.0.10

  blocked-web:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=blocked"]
    networks:
      netb:
        ipv4_address: 172.31.0.11

  udp-allowed:
    build:
      context: ../../images/udp-echo
    networks:
      netb:
        ipv4_address: 172.31.0.20

  udp-blocked:
    build:
      context: ../../images/udp-echo
    networks:
      netb:
        ipv4_address: 172.31.0.21

networks:
  neta:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  netb:
    ipam:
      config:
        - subnet: 172.31.0.0/24
