services:
  tester:
    build:
      context: ../../images/tester
    networks: [appnet]
    labels:
      - "portcullis.enable=true"
      - "portcullis.icc.mode=deny"

  peer:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=peer"]
    networks: [appnet]

networks:
  appnet:
    ipam:
      config:
        - subnet: 172.29.0.0/24
