name: Docs

# Builds the documentation site (site/) and publishes it to GitHub Pages, one directory per version on the gh-pages
# branch (scripts/docs-publish.sh): main/ on every push to main, vX.Y.Z/ once when a release is published, where it then
# stays. Pull requests only build it, which also checks every internal link. Run by hand with a version (main or a
# release tag) to build and publish that version again from its ref.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish again, main or a release tag such as v0.2.0
        required: true
        default: main

permissions:
  contents: read

env:
  # main, a release tag, or for pull requests a version of their own that is never published.
  VERSION: ${{ inputs.version || (github.event_name == 'release' && github.event.release.tag_name) || (github.event_name == 'pull_request' && 'pr') || 'main' }}

concurrency:
  # One run per version at a time; publishes of different versions retry on top of each other.
  group: docs-${{ github.event_name == 'pull_request' && github.ref || inputs.version || (github.event_name == 'release' && github.event.release.tag_name) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: docs
    # Only releases have docs of their own: not the latest pre-release, nor the apt and pacman repository releases.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node
      - name: Build
        working-directory: site
        env:
          DOCS_VERSION: ${{ env.VERSION }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: docs-${{ env.VERSION }}
          path: site/dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    permissions:
      # Pushes to the gh-pages branch, which GitHub Pages deploys.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-${{ env.VERSION }}
          path: ${{ runner.temp }}/docs
      - run: scripts/docs-publish.sh "$VERSION" "$RUNNER_TEMP/docs"
