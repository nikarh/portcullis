name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu: the binary needs at least its glibc (2.35), and
          # libnftables.so.1 at run time.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnftables-dev clang libclang-dev
      - run: rustup toolchain install
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME}" = "v$(cargo pkgid | sed 's/.*[#@]//')"
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Package
        run: |
          name="portcullis-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu"
          mkdir "${name}"
          cp target/release/portcullis dist/portcullis.service README.md LICENSE-MIT LICENSE-APACHE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: portcullis-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes portcullis-*.tar.gz*
