name: Publish

# Builds, signs and uploads the release files when a release is published, and for the `latest` pre-release when the
# Latest workflow calls it. Then adds the packages to the apt and pacman repositories: apt and pacman-<arch> have the
# releases, apt-latest and pacman-latest-<arch> the builds of main. Run by hand with repositories-only, it adds the
# files a release has already to the repositories again, without building anything.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true
      repositories-only:
        description: Only add the release's packages to the apt and pacman repositories, without building them again
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Only releases are built when published: the Latest workflow creates the `latest` pre-release once and publishes
    # it itself, and the apt and pacman repository releases have no files of their own.
    if: >-
      github.repository_owner == 'nikarh'
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
      && !inputs.repositories-only
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu: the binary needs at least its glibc (2.35), and libnftables.so.1 at run time.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # scripts/package.sh numbers a build of main by the commits up to it.
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libnftables-dev clang libclang-dev
      - run: rustup toolchain install
      - name: Check the tag matches the version
        if: startsWith(env.TAG, 'v')
        run: test "$TAG" = "v$(cargo pkgid | sed 's/.*[#@]//')"
      - run: cargo test --locked --release
      - run: cargo build --locked --release
        env:
          PORTCULLIS_VERSION_SUFFIX: ${{ inputs.version-suffix }}
      - name: Archive
        run: |
          set -euo pipefail
          target/release/portcullis --version
          mkdir -p out portcullis
          cp target/release/portcullis out/portcullis-${{ matrix.arch }}-linux-gnu
          cp target/release/portcullis dist/portcullis.service dist/config.toml README.md LICENSE-MIT LICENSE-APACHE portcullis/
          tar -czf out/portcullis-${{ matrix.arch }}-linux-gnu.tar.gz portcullis
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: nfpm
      - name: Packages
        run: |
          set -euo pipefail
          scripts/package.sh ${{ matrix.arch }} target/release/portcullis out
          scripts/check-deb.sh out/portcullis_*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  upload:
    name: Sign and upload
    needs: [build]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - run: cp dist/portcullis.service release/
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e release/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done

  pacman:
    name: pacman repository (${{ matrix.arch }})
    needs: [upload]
    # After the upload, or with repositories-only on their own.
    if: >-
      !cancelled() && (needs.upload.result == 'success'
      || (inputs.repositories-only && github.repository_owner == 'nikarh'))
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    # repo-add only reads the packages, so the x86_64 image does both architectures.
    container: archlinux:base
    environment: release
    defaults:
      run:
        shell: bash
    # The database is downloaded, changed and uploaded again.
    concurrency:
      group: pacman-${{ (inputs.tag || github.event.release.tag_name) == 'latest' && 'latest-' || '' }}${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - run: pacman -Syu --noconfirm --needed git github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: scripts
      # The files of the release, so the repositories have exactly those.
      - name: Download the packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir release --pattern SHA256SUMS --pattern 'portcullis-${{ matrix.arch }}.pkg.tar.zst'
          cd release && sha256sum --ignore-missing --strict -c SHA256SUMS
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: gpg --batch --import <<<"$GPG_PRIVATE_KEY"
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # Releases are kept for good; of the builds of main, the newest 100.
      - name: Add the package to the repository
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "$TAG" == latest ]]; then
            scripts/pacman-repo.sh pacman-latest-${{ matrix.arch }} 100 release/portcullis-${{ matrix.arch }}.pkg.tar.zst
          else
            scripts/pacman-repo.sh pacman-${{ matrix.arch }} 0 release/portcullis-${{ matrix.arch }}.pkg.tar.zst
          fi

  apt:
    name: apt repository
    needs: [upload]
    # After the upload, or with repositories-only on their own.
    if: >-
      !cancelled() && (needs.upload.result == 'success'
      || (inputs.repositories-only && github.repository_owner == 'nikarh'))
    runs-on: ubuntu-24.04
    environment: release
    # The index is downloaded, changed and uploaded again.
    concurrency:
      group: apt${{ (inputs.tag || github.event.release.tag_name) == 'latest' && '-latest' || '' }}
      cancel-in-progress: false
    env:
      REPO: ${{ (inputs.tag || github.event.release.tag_name) == 'latest' && 'apt-latest' || 'apt' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            scripts
            docs
      # The files of the release, so the repositories have exactly those.
      - name: Download the packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir release --pattern SHA256SUMS --pattern 'portcullis_*.deb'
          cd release && sha256sum --ignore-missing --strict -c SHA256SUMS
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: gpg --batch --import <<<"$GPG_PRIVATE_KEY"
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # Releases are kept for good; of the builds of main, the newest 100.
      - name: Add the packages to the repository
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/apt-repo.sh "$REPO" ${{ env.TAG == 'latest' && 100 || 0 }} release/portcullis_amd64.deb release/portcullis_arm64.deb
      # Added as a user would (see Installation in the docs).
      - name: Check apt sees the new version
        run: |
          set -euo pipefail
          sudo install -m 0644 docs/signing-key.asc /etc/apt/keyrings/portcullis.asc
          echo "deb [signed-by=/etc/apt/keyrings/portcullis.asc] $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$REPO/ ./" \
            | sudo tee /etc/apt/sources.list.d/portcullis.list
          sudo apt-get update
          version=$(dpkg-deb -f release/portcullis_amd64.deb Version)
          apt-cache madison portcullis
          # The columns are padded: "portcullis |    0.1.1-1 | <url> ./ Packages".
          apt-cache madison portcullis | awk -F' *[|] *' '{ print $2 }' | grep -qxF "${version}"
