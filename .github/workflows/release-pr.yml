name: Create a release PR

# Bumps the version in Cargo.toml, regenerates CHANGELOG.md and opens a "Release vX.Y.Z" pull request with the release
# notes. Merging it releases (the Release workflow).

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version update
        options:
          - patch
          - minor
          - major

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: git-cliff
      - run: rustup toolchain install
      - id: bump
        name: Update version
        run: echo "version=$(scripts/bump-version.sh ${{ inputs.version }})" >> "$GITHUB_OUTPUT"
      - name: Update changelog
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git cliff --tag "v${{ steps.bump.outputs.version }}" -o CHANGELOG.md
          git cliff --tag "v${{ steps.bump.outputs.version }}" --unreleased --strip all -o "$RUNNER_TEMP/notes.md"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: Release v${{ steps.bump.outputs.version }}
          commit-message: Release v${{ steps.bump.outputs.version }}
          body-path: ${{ runner.temp }}/notes.md
          branch: release
          labels: release
          delete-branch: true
