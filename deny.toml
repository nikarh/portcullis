[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Apache-2.0, BSD-3-Clause and ISC come with the build-time bindgen.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
# The ecosystem is moving from syn 2 to 3; both are build-time only (derive macros).
skip = [{ crate = "syn@2.0.119", reason = "tracing-attributes still uses syn 2" }]
# Lint level for when a crate version requirement is `*`
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
